server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # Forward API calls to the backend container, so the browser only talks to one origin.
  location /api/ {
    proxy_pass http://api:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Vite fingerprints these files, so they can be cached "forever".
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  location /images/ {
    expires 30d;
    add_header Cache-Control "public, immutable";
  }

  # Single-page app: unknown paths (e.g. /checkout on refresh) fall back to index.html.
  location / {
    try_files $uri /index.html;
  }
}
